services:
  db:
    image: pgvector/pgvector:pg16
    container_name: wagewise-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wagewise
      POSTGRES_PASSWORD: wagewise123
      POSTGRES_DB: wagewise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagewise -d wagewise"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: